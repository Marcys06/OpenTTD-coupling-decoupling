name: Apply 0.0.2 coupling patch

on:
  workflow_dispatch:
  push:
    branches: [jgrpp]
    paths:
      - .github/workflows/apply-0.0.2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise RuntimeError(f'pattern not found: {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('src/command_type.h',
              '\n\tEnd,                                    ///< Must ALWAYS be on the end of this list!! (period)',
              '\n\tDecoupleTrain,                          ///< Detach the last wagon from a stopped train\n\n\tEnd,                                    ///< Must ALWAYS be on the end of this list!! (period)')

          replace_once('src/train_cmd.h',
              '#include "command_type.h"\n#include "vehicle_type.h"\n#include "train.h"',
              '#include "company_func.h"\n#include "command_type.h"\n#include "vehicle_type.h"\n#include "train.h"')

          replace_once('src/train_cmd.h',
              'DEF_CMD_TUPLE_LT (Commands::SetTrainSpeedRestriction, CmdSetTrainSpeedRestriction, {}, CommandType::VehicleManagement,   CmdDataT<VehicleID, uint16_t>)',
              'DEF_CMD_TUPLE_LT (Commands::SetTrainSpeedRestriction, CmdSetTrainSpeedRestriction, {}, CommandType::VehicleManagement,   CmdDataT<VehicleID, uint16_t>)\nDEF_CMD_TUPLE_LT (Commands::DecoupleTrain,            CmdDecoupleTrain,             {}, CommandType::VehicleManagement,   CmdDataT<VehicleID>)')

          function = '''\n/** Prototype command for the first in-game coupling test. */\ninline CommandCost CmdDecoupleTrain(DoCommandFlags flags, VehicleID veh_id)\n{\n\tTrain *train = Train::GetIfValid(veh_id);\n\tif (train == nullptr || !train->IsPrimaryVehicle()) return CMD_ERROR;\n\tif (train->owner != _current_company) return CMD_ERROR;\n\tif (!train->IsStoppedInDepot()) return CMD_ERROR;\n\n\tTrain *last_unit = train->GetLastUnit();\n\tif (last_unit == nullptr || !last_unit->IsWagon()) return CMD_ERROR;\n\n\tif (flags.Test(DoCommandFlag::Execute) && !DetachTrainWagonChain(last_unit)) return CMD_ERROR;\n\treturn CommandCost();\n}\n'''
          replace_once('src/train_cmd.h', '\n#endif /* TRAIN_CMD_H */\n', function + '\n#endif /* TRAIN_CMD_H */\n')

          replace_once('src/lang/english.txt',
              'STR_VEHICLE_VIEW_TRAIN_IGNORE_SIGNAL_TOOLTIP                    :{BLACK}Force train to proceed without waiting for signal to clear it',
              'STR_VEHICLE_VIEW_TRAIN_IGNORE_SIGNAL_TOOLTIP                    :{BLACK}Force train to proceed without waiting for signal to clear it\nSTR_VEHICLE_VIEW_TRAIN_DECOUPLE_TOOLTIP                         :{BLACK}DECOUPLE: detach the last wagon from the stopped train')

          replace_once('src/vehicle_gui.cpp',
              '''\t\tif (v->type == VehicleType::Train) {\n\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, Train::From(v)->force_proceed == TFP_SIGNAL);\n\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, !can_control);\n\t\t}''',
              '''\t\tif (v->type == VehicleType::Train) {\n\t\t\tTrain *train = Train::From(v);\n\t\t\tif (train->IsStoppedInDepot()) {\n\t\t\t\tbool can_decouple = can_control && train->GetLastUnit() != nullptr && train->GetLastUnit()->IsWagon();\n\t\t\t\tthis->GetWidget<NWidgetCore>(WID_VV_FORCE_PROCEED)->SetToolTip(STR_VEHICLE_VIEW_TRAIN_DECOUPLE_TOOLTIP);\n\t\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, false);\n\t\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, !can_decouple);\n\t\t\t} else {\n\t\t\t\tthis->GetWidget<NWidgetCore>(WID_VV_FORCE_PROCEED)->SetToolTip(STR_VEHICLE_VIEW_TRAIN_IGNORE_SIGNAL_TOOLTIP);\n\t\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, train->force_proceed == TFP_SIGNAL);\n\t\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, !can_control);\n\t\t\t}\n\t\t}''')

          replace_once('src/vehicle_gui.cpp',
              '''\t\t\tcase WID_VV_FORCE_PROCEED: // force proceed\n\t\t\t\tassert(v->type == VehicleType::Train);\n\t\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t\t\tbreak;''',
              '''\t\t\tcase WID_VV_FORCE_PROCEED: // force proceed / decouple\n\t\t\t\tassert(v->type == VehicleType::Train);\n\t\t\t\tif (Train::From(v)->IsStoppedInDepot()) {\n\t\t\t\t\tCommand<Commands::DecoupleTrain>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t\t\t} else {\n\t\t\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t\t\t}\n\t\t\t\tbreak;''')

          PY
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-0.0.2.yml
          git add src/command_type.h src/train_cmd.h src/lang/english.txt src/vehicle_gui.cpp
          git commit -m "0.0.2: Add in-game DECOUPLE test"
          git push origin HEAD:jgrpp
