name: Fix decoupling GUI compile errors

on:
  pull_request:
    branches: [jgrpp]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Trigger PR fix workflow
        run: echo "PR GUI fix is handled by fix-pr-gui.yml"
