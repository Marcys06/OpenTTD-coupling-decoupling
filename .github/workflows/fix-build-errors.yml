name: Fix decoupling GUI compile errors

on:
  pull_request:
    branches: [jgrpp]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix vehicle GUI source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/vehicle_gui.cpp')
          s = p.read_text(encoding='utf-8')

          bad_size = '''\t\tcase WID_VV_FORCE_PROCEED: // force proceed / decouple
\t\t\t\tassert(v->type == VehicleType::Train);
\t\t\t\tif (CanDecoupleTrainAtStation(Train::From(v))) {
\t\t\t\t\tCommand<Commands::DecoupleTrain>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);
\t\t\t\t} else {
\t\t\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);
\t\t\t\t}
\t\t\t\tbreak;'''
          if bad_size not in s: raise SystemExit('bad UpdateWidgetSize block not found')
          s = s.replace(bad_size, '', 1)

          s = s.replace('''\t\tif (v->type == VehicleType::Train) {\n\t\t\tTrain *train = Train::From(v);''', '''\t\tif (v->type == VehicleType::Train) {\n\t\t\tconst Train *train = Train::From(v);''', 1)

          old_click = '''\t\t\tcase WID_VV_FORCE_PROCEED: // force proceed / decouple
\t\t\t\tassert(v->type == VehicleType::Train);
\t\t\t\tif (Train::From(v)->IsStoppedInDepot()) {
\t\t\t\t\tCommand<Commands::DecoupleTrain>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);
\t\t\t\t} else {
\t\t\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);
\t\t\t\t}
\t\t\t\tbreak;'''
          new_click = '''\t\t\tcase WID_VV_FORCE_PROCEED: // force proceed / decouple
\t\t\t\tassert(v->type == VehicleType::Train);
\t\t\t\tif (CanDecoupleTrainAtStation(Train::From(v))) {
\t\t\t\t\tCommand<Commands::DecoupleTrain>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);
\t\t\t\t} else {
\t\t\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);
\t\t\t\t}
\t\t\t\tbreak;'''
          if old_click not in s: raise SystemExit('old click block not found')
          s = s.replace(old_click, new_click, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vehicle_gui.cpp
          git commit -m "0.0.3: Fix station decoupling GUI"
          git push origin HEAD:${{ github.head_ref }}

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-build-errors.yml
          git commit -m "0.0.3: Remove temporary GUI fix workflow"
          git push origin HEAD:${{ github.head_ref }}
