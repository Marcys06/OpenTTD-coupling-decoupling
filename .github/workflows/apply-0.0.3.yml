name: Apply 0.0.3 station decoupling

on:
  workflow_dispatch:
  push:
    branches: [jgrpp]
    paths:
      - '.github/workflows/apply-0.0.3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          # command_type.h: keep DecoupleTrain immediately before End.
          p = 'src/command_type.h'
          s = read(p)
          if 'DecoupleTrain' not in s:
              s, n = re.subn(r'(?m)^(\s*)End,\s*///<', r'\1DecoupleTrain,                         ///< Decouple a train at a station\n\1End,                                    ///<', s, count=1)
              if n != 1:
                  raise SystemExit('Could not add DecoupleTrain to command_type.h')
              write(p, s)

          # train_cmd.h: station-only decouple predicate and command.
          p = 'src/train_cmd.h'
          s = read(p)
          if '#include "station_map.h"' not in s:
              s = s.replace('#include "train.h"\n', '#include "train.h"\n#include "station_map.h"\n', 1)

          old = '''inline CommandCost CmdDecoupleTrain(DoCommandFlags flags, VehicleID veh_id)\n{\n\tTrain *train = Train::GetIfValid(veh_id);\n\tif (train == nullptr || !train->IsPrimaryVehicle()) return CMD_ERROR;\n\tif (train->owner != _current_company) return CMD_ERROR;\n\tif (!train->IsStoppedInDepot()) return CMD_ERROR;\n\n\tTrain *last_unit = train->GetLastUnit();\n\tif (last_unit == nullptr || !last_unit->IsWagon()) return CMD_ERROR;\n\n\tif (flags.Test(DoCommandFlag::Execute) && !DetachTrainWagonChain(last_unit)) return CMD_ERROR;\n\treturn CommandCost();\n}\n'''
          new = '''inline bool CanDecoupleTrainAtStation(const Train *train)\n{\n\tif (train == nullptr || !train->IsPrimaryVehicle()) return false;\n\tif (!train->vehstatus.Test(VehState::Stopped) || train->cur_speed != 0) return false;\n\tif (!train->current_order.IsAnyLoadingType()) return false;\n\n\tTrain *last_unit = const_cast<Train *>(train)->GetLastUnit();\n\treturn last_unit != nullptr && last_unit->IsWagon();\n}\n\ninline CommandCost CmdDecoupleTrain(DoCommandFlags flags, VehicleID veh_id)\n{\n\tTrain *train = Train::GetIfValid(veh_id);\n\tif (!CanDecoupleTrainAtStation(train)) return CMD_ERROR;\n\tif (train->owner != _current_company) return CMD_ERROR;\n\n\tTrain *last_unit = train->GetLastUnit();\n\tif (flags.Test(DoCommandFlag::Execute) && !DetachTrainWagonChain(last_unit)) return CMD_ERROR;\n\treturn CommandCost();\n}\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'CanDecoupleTrainAtStation' not in s:
              raise SystemExit('Could not find CmdDecoupleTrain in train_cmd.h')
          write(p, s)

          # English string: add station decouple tooltip if missing.
          p = 'src/lang/english.txt'
          s = read(p)
          if 'STR_VEHICLE_VIEW_TRAIN_DECOUPLE_TOOLTIP' not in s:
              marker = 'STR_VEHICLE_VIEW_TRAIN_IGNORE_SIGNAL_TOOLTIP'
              m = re.search(r'(?m)^' + re.escape(marker) + r'.*$', s)
              if not m:
                  raise SystemExit('Could not find ignore signal tooltip in english.txt')
              line = m.group(0)
              s = s[:m.start()] + line + '\nSTR_VEHICLE_VIEW_TRAIN_DECOUPLE_TOOLTIP    :{BLACK}DECOUPLE: detach the last wagon at a station' + s[m.end():]
              write(p, s)

          # Vehicle GUI: the existing ignore-signal button becomes DECOUPLE only
          # while a train is stopped and actually loading at a station.
          p = 'src/vehicle_gui.cpp'
          s = read(p)
          old = '''\tif (v->type == VehicleType::Train) {\n\t\tTrain *train = Train::From(v);\n\t\tif (train->IsStoppedInDepot()) {\n\t\t\tbool can_decouple = can_control && train->GetLastUnit() != nullptr && train->GetLastUnit()->IsWagon();\n\t\t\tthis->GetWidget<NWidgetCore>(WID_VV_FORCE_PROCEED)->SetToolTip(STR_VEHICLE_VIEW_TRAIN_DECOUPLE_TOOLTIP);\n\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, false);\n\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, !can_decouple);\n\t\t} else {\n\t\t\tthis->GetWidget<NWidgetCore>(WID_VV_FORCE_PROCEED)->SetToolTip(STR_VEHICLE_VIEW_TRAIN_IGNORE_SIGNAL_TOOLTIP);\n\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, train->force_proceed == TFP_SIGNAL);\n\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, !can_control);\n\t\t}\n\t}\n'''
          new = '''\tif (v->type == VehicleType::Train) {\n\t\tTrain *train = Train::From(v);\n\t\tif (CanDecoupleTrainAtStation(train) && can_control) {\n\t\t\tthis->GetWidget<NWidgetCore>(WID_VV_FORCE_PROCEED)->SetToolTip(STR_VEHICLE_VIEW_TRAIN_DECOUPLE_TOOLTIP);\n\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, false);\n\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, false);\n\t\t} else {\n\t\t\tthis->GetWidget<NWidgetCore>(WID_VV_FORCE_PROCEED)->SetToolTip(STR_VEHICLE_VIEW_TRAIN_IGNORE_SIGNAL_TOOLTIP);\n\t\t\tthis->SetWidgetLoweredState(WID_VV_FORCE_PROCEED, train->force_proceed == TFP_SIGNAL);\n\t\t\tthis->SetWidgetDisabledState(WID_VV_FORCE_PROCEED, !can_control);\n\t\t}\n\t}\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'CanDecoupleTrainAtStation(train)' not in s:
              raise SystemExit('Could not find 0.0.2 train button block in vehicle_gui.cpp')

          old = '''\tcase WID_VV_FORCE_PROCEED: // force proceed / decouple\n\t\tassert(v->type == VehicleType::Train);\n\t\tif (Train::From(v)->IsStoppedInDepot()) {\n\t\t\tCommand<Commands::DecoupleTrain>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t} else {\n\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t}\n\t\tbreak;\n'''
          new = '''\tcase WID_VV_FORCE_PROCEED: // force proceed / decouple\n\t\tassert(v->type == VehicleType::Train);\n\t\tif (CanDecoupleTrainAtStation(Train::From(v))) {\n\t\t\tCommand<Commands::DecoupleTrain>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t} else {\n\t\t\tCommand<Commands::ForceTrainProceed>::Post(STR_ERROR_CAN_T_MAKE_TRAIN_PASS_SIGNAL, v->tile, v->index);\n\t\t}\n\t\tbreak;\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Command<Commands::DecoupleTrain>::Post' not in s:
              raise SystemExit('Could not find decouple click handler in vehicle_gui.cpp')
          write(p, s)

          print('0.0.3 source changes applied')

      - name: Validate diff
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/command_type.h src/train_cmd.h src/lang/english.txt src/vehicle_gui.cpp
          git commit -m "0.0.3: Decouple trains at stations" || exit 0
          git push origin HEAD:jgrpp

      - name: Remove workflow
        run: |
          rm -f .github/workflows/apply-0.0.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-0.0.3.yml
          git commit -m "0.0.3: Remove patch workflow"
          git push origin HEAD:jgrpp
